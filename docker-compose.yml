services:
  postgres:
    image: postgres:18-alpine
    container_name: sol-postgres
    environment:
      POSTGRES_USER: sol
      POSTGRES_PASSWORD: sol_dev_password
      POSTGRES_DB: sol
    ports:
      - "5432:5432"
    # postgres:18+ expects a single mount at /var/lib/postgresql (data lands in a
    # subdirectory) so that pg_upgrade --link works without mount-boundary issues.
    volumes:
      - sol-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sol -d sol"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Host ports are offset from the defaults: other long-running projects on this
  # machine already bind 6379 / 5672 / 15672. Container-internal ports are unchanged.
  redis:
    image: redis:8-alpine
    container_name: sol-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6380:6379"
    volumes:
      - sol-redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: sol-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: sol
      RABBITMQ_DEFAULT_PASS: sol_dev_password
    ports:
      - "5673:5672"
      - "15673:15672"
    volumes:
      - sol-rabbitdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Executes uploaded Skill scripts outside Sol.Api. It has no network, no Sol configuration,
  # no database/cache/broker volumes, and no Docker socket. Each script is isolated again with
  # bubblewrap inside this already-constrained container.
  skill-runner:
    build:
      context: ./runner
    container_name: sol-skill-runner
    network_mode: none
    read_only: true
    # Docker Desktop disables unprivileged user namespaces, so the runner can fall back to a
    # per-job chroot + unique uid. These narrow capabilities only construct/clean that jail and
    # signal timed-out descendants; the interpreter drops every capability before user code starts.
    # Sol.Api never receives them.
    user: "0:0"
    cap_drop: ["ALL"]
    cap_add: ["CHOWN", "DAC_OVERRIDE", "KILL", "SETGID", "SETUID", "SYS_CHROOT"]
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 1g
    cpus: 1.0
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
      - /jobs:rw,exec,nosuid,nodev,size=512m
    volumes:
      # Read-only source mounts keep local runner edits testable without rebuilding the image;
      # production images still carry the same files from runner/Dockerfile.
      - ./runner/runner.py:/app/runner.py:ro
      - ./runner/healthcheck.py:/app/healthcheck.py:ro
      - ./runner/integration_test.py:/app/integration_test.py:ro
      - ./runner/chroot_exec.py:/app/chroot_exec.py:ro
      - sol-runner-socket:/run/sol
    environment:
      SOL_RUNNER_SOCKET: /run/sol/runner.sock
      SOL_RUNNER_JOBS: /jobs
      SOL_RUNNER_MAX_REQUEST_BYTES: 41943040
      SOL_RUNNER_MAX_PACKAGE_BYTES: 26214400
      SOL_RUNNER_MAX_FILES: 1000
      SOL_RUNNER_MAX_CONCURRENT: 2
    healthcheck:
      test: ["CMD", "/usr/bin/python3", "/app/healthcheck.py"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  sol-pgdata:
  sol-redisdata:
  sol-rabbitdata:
  sol-runner-socket:
