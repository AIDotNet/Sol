services:
  postgres:
    image: postgres:18-alpine
    container_name: sol-postgres
    environment:
      POSTGRES_USER: sol
      POSTGRES_PASSWORD: sol_dev_password
      POSTGRES_DB: sol
    ports:
      - "5432:5432"
    # postgres:18+ expects a single mount at /var/lib/postgresql (data lands in a
    # subdirectory) so that pg_upgrade --link works without mount-boundary issues.
    volumes:
      - sol-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sol -d sol"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Host ports are offset from the defaults: other long-running projects on this
  # machine already bind 6379 / 5672 / 15672. Container-internal ports are unchanged.
  redis:
    image: redis:8-alpine
    container_name: sol-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6380:6379"
    volumes:
      - sol-redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: sol-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: sol
      RABBITMQ_DEFAULT_PASS: sol_dev_password
    ports:
      - "5673:5672"
      - "15673:15672"
    volumes:
      - sol-rabbitdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Executes uploaded Skill scripts outside Sol.Api. It has no network, no Sol configuration,
  # no database/cache/broker volumes, and no Docker socket. Each script is isolated again with
  # bubblewrap inside this already-constrained container.
  skill-runner:
    build:
      context: ./runner
    container_name: sol-skill-runner
    network_mode: none
    read_only: true
    # Docker Desktop disables unprivileged user namespaces, so the runner can fall back to a
    # per-job chroot + unique uid. These narrow capabilities only construct/clean that jail and
    # signal timed-out descendants; the interpreter drops every capability before user code starts.
    # Sol.Api never receives them.
    user: "0:0"
    cap_drop: ["ALL"]
    cap_add: ["CHOWN", "DAC_OVERRIDE", "KILL", "SETGID", "SETUID", "SYS_CHROOT"]
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 1g
    cpus: 1.0
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
      - /jobs:rw,exec,nosuid,nodev,size=512m
    volumes:
      # Read-only source mounts keep local runner edits testable without rebuilding the image;
      # production images still carry the same files from runner/Dockerfile.
      - ./runner/runner.py:/app/runner.py:ro
      - ./runner/healthcheck.py:/app/healthcheck.py:ro
      - ./runner/integration_test.py:/app/integration_test.py:ro
      - ./runner/chroot_exec.py:/app/chroot_exec.py:ro
      - sol-runner-socket:/run/sol
    environment:
      SOL_RUNNER_SOCKET: /run/sol/runner.sock
      SOL_RUNNER_JOBS: /jobs
      SOL_RUNNER_MAX_REQUEST_BYTES: 41943040
      SOL_RUNNER_MAX_PACKAGE_BYTES: 26214400
      SOL_RUNNER_MAX_FILES: 1000
      SOL_RUNNER_MAX_CONCURRENT: 2
    healthcheck:
      test: ["CMD", "/usr/bin/python3", "/app/healthcheck.py"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Native AOT build of Sol.Api (see src/Sol.Api/Dockerfile for the SDK/toolchain notes).
  # Containerized so it can share the skill-runner's Unix socket volume — the production
  # setup docs/operations.md calls for — which a host-run `dotnet run` cannot see.
  api:
    build:
      context: .
      dockerfile: src/Sol.Api/Dockerfile
    container_name: sol-api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "5298:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      Postgres__ConnectionString: "Host=postgres;Port=5432;Database=sol;Username=sol;Password=sol_dev_password"
      Postgres__RunMigrationsOnStartup: "true"
      Redis__Configuration: "redis:6379"
      Redis__InstanceName: "sol:"
      RabbitMq__HostName: rabbitmq
      RabbitMq__Port: "5672"
      RabbitMq__UserName: sol
      RabbitMq__Password: sol_dev_password
      Realtime__Backplane: "None"
      Authentication__PublicOrigin: "http://localhost:3000"
      # Same dev-only placeholders as appsettings.Development.json — never reuse in production.
      DeviceIdentity__Pepper: "dev-only-pepper-do-not-use-in-production"
      Ai__EncryptionKey: "c29sLWRldi1rZXktbm90LWZvci1wcm9kdWN0aW9uISE="
      # Points at the same socket skill-runner listens on, via the shared volume below.
      Skills__RunnerSocketPath: "/run/sol/runner.sock"
    volumes:
      - sol-runner-socket:/run/sol
    restart: unless-stopped

  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_SITE_URL: http://localhost:3000
        API_BASE_URL: http://api:8080
        SOL_API_ORIGIN: http://api:8080
    container_name: sol-web
    depends_on:
      - api
    ports:
      - "3000:3000"
    environment:
      # Rewrites in next.config.ts and server-side fetches both need the in-network API address.
      SOL_API_ORIGIN: http://api:8080
      API_BASE_URL: http://api:8080
    restart: unless-stopped

volumes:
  sol-pgdata:
  sol-redisdata:
  sol-rabbitdata:
  sol-runner-socket:
